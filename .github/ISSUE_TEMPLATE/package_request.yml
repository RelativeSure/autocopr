name: Package request
description: Request a new package to be added to this COPR repo
title: "[Package]: "
labels: ["package-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request that a new package be added as a `.spec` under `specs/` and built by this COPR repo.

  - type: input
    id: name
    attributes:
      label: Package name
      description: The name you'd like the package to be built/imported as.
      placeholder: package-name
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream project URL
      description: Link to the upstream source repo (e.g. GitHub) that releases this package.
      placeholder: https://github.com/owner/project
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version to package
      description: Latest release version, or "latest" if it should always track the newest release.
      placeholder: v1.2.3
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: Language / build system
      description: How is the upstream project built?
      options:
        - Rust (cargo)
        - Go
        - Python
        - C/C++ (make/cmake)
        - Prebuilt binary release
        - Other/unsure
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why should this package be added?
      description: What problem does it solve, or why is it useful to have available via this COPR?
    validations:
      required: true

  - type: textarea
    id: license
    attributes:
      label: License
      description: The upstream project's license (must be compatible with Fedora packaging guidelines).
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Existing spec files, packaging notes, known build quirks, or links to similar packages in other repos.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this package hasn't already been requested
          required: true
        - label: I checked that this package isn't already available in `specs/`
          required: true
