[project]
name = "autocopr"
version = "1.0.0"
description = "Checks GitHub Releases for new versions and updates this repo's RPM spec files for automatic COPR updates."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
]

[tool.uv]
required-version = ">=0.11.0"
